<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · 数字合并游戏</title>
<meta name="description" content="标准 4×4 2048 游戏，纯 HTML + CSS + JavaScript 单文件实现，支持键盘方向键与触屏滑动。">
<style>
  /* ============ 基础 ============ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #faf8ef;
    color: #776e65;
    min-height: 100vh;
  }
  button { font-family: inherit; }

  .page {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px 32px;
  }

  /* ============ 顶部标题区 ============ */
  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  .title {
    margin: 0;
    font-size: 2.6rem;
    line-height: 1;
    font-weight: 800;
    color: #776e65;
  }
  .subtitle { margin: 6px 0 0; font-size: 0.92rem; color: #a69a8f; }

  .hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; }
  .score-box {
    min-width: 76px;
    text-align: center;
    background: #bbada0;
    border-radius: 8px;
    padding: 6px 12px;
    color: #eee4da;
  }
  .score-label { display: block; font-size: 0.72rem; letter-spacing: 0.08em; }
  .score-value { display: block; font-size: 1.35rem; font-weight: 700; color: #fff; line-height: 1.2; }

  .btn {
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 8px 16px;
    color: #f9f6f2;
    background: #8f7a66;
    transition: background-color 0.15s ease, transform 0.15s ease;
  }
  .btn:hover { background: #9f8b77; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-ghost { background: #bbada0; }
  .btn-ghost:hover { background: #c8b9ab; }

  /* ============ 棋盘 ============ */
  .board-wrap { position: relative; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: min(100%, 460px);
    margin: 0 auto;
    padding: 10px;
    background: #bbada0;
    border-radius: 10px;
    touch-action: none;   /* 避免触屏滑动与页面滚动冲突 */
    -webkit-user-select: none;
    user-select: none;
  }
  .cell {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 800;
    font-size: clamp(1.4rem, 7vw, 2.1rem);
    line-height: 1;
    background: #cdc1b4;
    color: #cdc1b4;
  }
  .cell.cell-lg { font-size: clamp(1rem, 5vw, 1.5rem); }

  /* ============ 状态遮罩 ============ */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(238, 228, 218, 0.72);
    border-radius: 10px;
    text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay-box { padding: 12px; }
  .overlay-title { margin: 0 0 6px; font-size: 2rem; font-weight: 800; color: #776e65; }
  .overlay-text { margin: 0 0 18px; font-size: 1rem; color: #8a7d70; }
  .overlay-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .overlay-actions button[hidden] { display: none; }

  /* ============ 提示 ============ */
  .hint { margin: 18px 0 0; text-align: center; font-size: 0.92rem; color: #a69a8f; }
  .hint-rule { margin: 6px 0 0; text-align: center; font-size: 0.82rem; color: #c0b4a8; }

  /* ============ AI 自动游玩控制栏 ============ */
  .ai-panel {
    margin-top: 18px;
    padding: 14px;
    background: #f5efe7;
    border: 1px solid #e4d9cb;
    border-radius: 10px;
  }
  .ai-panel-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .ai-title { margin: 0; font-size: 1.05rem; font-weight: 800; color: #776e65; }
  .ai-status { margin: 4px 0 0; font-size: 0.86rem; color: #a69a8f; }
  .ai-status[data-state='running'] { color: #2f7d4c; font-weight: 700; }
  .ai-status[data-state='won'] { color: #a77a00; font-weight: 700; }
  .ai-status[data-state='over'],
  .ai-status[data-state='no-move'] { color: #b45f4b; font-weight: 700; }
  .ai-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .ai-actions .btn:disabled {
    cursor: not-allowed;
    opacity: 0.45;
    transform: none;
  }
  .ai-search {
    margin: 9px 0 0;
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    font-size: 0.76rem;
    line-height: 1.45;
    color: #a69a8f;
    overflow-wrap: anywhere;
  }

  /* ============ 游戏记录 ============ */
  .history { margin-top: 26px; }
  .history-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-bottom: 10px;
  }
  .history-title { margin: 0; font-size: 1.15rem; font-weight: 800; color: #776e65; }
  .history-note { margin: 0; font-size: 0.78rem; color: #a69a8f; }
  .history-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .history-stat {
    min-width: 0;
    padding: 10px 8px;
    text-align: center;
    background: #f5efe7;
    border: 1px solid #e4d9cb;
    border-radius: 8px;
  }
  .history-stat-label { display: block; font-size: 0.7rem; color: #a69a8f; letter-spacing: 0.03em; }
  .history-stat-value {
    display: block;
    margin-top: 2px;
    font-size: 1.15rem;
    font-weight: 800;
    color: #776e65;
    overflow-wrap: anywhere;
  }
  .history-panel {
    margin-top: 10px;
    overflow: hidden;
    background: #f5efe7;
    border: 1px solid #e4d9cb;
    border-radius: 8px;
  }
  .history-head,
  .history-row {
    display: grid;
    grid-template-columns: minmax(48px, 0.75fr) minmax(70px, 1.25fr) minmax(58px, 0.9fr) minmax(48px, 0.8fr);
    gap: 8px;
    align-items: center;
    padding: 9px 10px;
  }
  .history-head { font-size: 0.72rem; color: #a69a8f; background: #efe4d8; }
  .history-row { border-top: 1px solid #eadfd2; font-size: 0.88rem; color: #776e65; }
  .history-game { font-weight: 700; white-space: nowrap; }
  .history-score { text-align: right; font-weight: 700; white-space: nowrap; }
  .history-tile { text-align: center; white-space: nowrap; }
  .history-result { text-align: right; font-weight: 800; white-space: nowrap; }
  .result-win { color: #2f7d4c; }
  .result-loss { color: #b45f4b; }
  .history-empty {
    margin: 0;
    padding: 18px 12px;
    text-align: center;
    color: #a69a8f;
    font-size: 0.88rem;
  }
  @media (min-width: 480px) {
    .history-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  /* ============ 小屏适配 ============ */
  @media (max-width: 420px) {
    .page { padding: 14px 12px 24px; }
    .title { font-size: 2.1rem; }
    .board { gap: 8px; padding: 8px; border-radius: 8px; }
    .cell { border-radius: 4px; }
  }

  /* ============ 深色主题（默认浅色；<html data-theme="dark"> 时生效） ============ */
  [data-theme='dark'] body { background: #20242a; color: #d8d3cb; }
  [data-theme='dark'] .title { color: #ece6dd; }
  [data-theme='dark'] .subtitle { color: #a9a49b; }
  [data-theme='dark'] .board { background: #3a3e45; }
  [data-theme='dark'] .cell { background: #4a4f57; color: #4a4f57; }
  [data-theme='dark'] .score-box { background: #2c3037; }
  [data-theme='dark'] .score-label { color: #c9c4bc; }
  [data-theme='dark'] .btn { background: #4c5560; }
  [data-theme='dark'] .btn:hover { background: #5b6571; }
  [data-theme='dark'] .btn-ghost { background: #383c43; }
  [data-theme='dark'] .btn-ghost:hover { background: #434850; }
  [data-theme='dark'] .overlay { background: rgba(25, 28, 33, 0.78); }
  [data-theme='dark'] .overlay-title { color: #ece6dd; }
  [data-theme='dark'] .overlay-text { color: #b3aea6; }
  [data-theme='dark'] .hint { color: #a9a49b; }
  [data-theme='dark'] .history-title,
  [data-theme='dark'] .history-stat-value { color: #ece6dd; }
  [data-theme='dark'] .history-note,
  [data-theme='dark'] .history-stat-label,
  [data-theme='dark'] .history-head,
  [data-theme='dark'] .history-empty { color: #a9a49b; }
  [data-theme='dark'] .history-stat,
  [data-theme='dark'] .history-panel { background: #2c3037; border-color: #414750; }
  [data-theme='dark'] .history-head { background: #353a42; }
  [data-theme='dark'] .history-row { border-color: #414750; color: #d8d3cb; }
  [data-theme='dark'] .result-win { color: #7fd39b; }
  [data-theme='dark'] .result-loss { color: #e29480; }
  [data-theme='dark'] .hint-rule { color: #8f8a82; }
  [data-theme='dark'] .ai-panel { background: #2c3037; border-color: #414750; }
  [data-theme='dark'] .ai-title { color: #ece6dd; }
  [data-theme='dark'] .ai-status,
  [data-theme='dark'] .ai-search { color: #a9a49b; }
  [data-theme='dark'] .ai-status[data-state='running'] { color: #7fd39b; }
  [data-theme='dark'] .ai-status[data-state='won'] { color: #e5c15d; }
  [data-theme='dark'] .ai-status[data-state='over'],
  [data-theme='dark'] .ai-status[data-state='no-move'] { color: #e29480; }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <div>
      <h1 class="title">2048</h1>
      <p class="subtitle">合并相同数字，挑战 2048！</p>
    </div>
    <div class="hud">
      <div class="score-box" aria-label="当前分数">
        <span class="score-label">分数 SCORE</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-box" aria-label="历史最高分">
        <span class="score-label">最高分 BEST</span>
        <span class="score-value" id="best">0</span>
      </div>
      <button class="btn" id="restart" type="button">重新开始</button>
      <button class="btn btn-ghost" id="theme-toggle" type="button">🌙 深色</button>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="2048 游戏棋盘"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="overlay-box">
        <h2 class="overlay-title" id="overlay-title">游戏结束</h2>
        <p class="overlay-text" id="overlay-text"></p>
        <div class="overlay-actions">
          <button class="btn btn-ghost" id="btn-continue" type="button" hidden>继续挑战</button>
          <button class="btn" id="btn-restart-overlay" type="button">再来一局</button>
        </div>
      </div>
    </div>
  </div>

  <section class="ai-panel" aria-labelledby="ai-title">
    <div class="ai-panel-main">
      <div>
        <h2 class="ai-title" id="ai-title">AI 自动游玩</h2>
        <p class="ai-status" id="ai-status" data-state="idle">AI 状态：未运行</p>
      </div>
      <div class="ai-actions">
        <button class="btn" id="ai-start" type="button">AI 开始</button>
        <button class="btn btn-ghost" id="ai-stop" type="button" disabled>AI 停止</button>
      </div>
    </div>
    <p class="ai-search" id="ai-search">AI 搜索：等待启动</p>
  </section>

  <p class="hint">键盘：方向键 ↑ ↓ ← → 移动 ｜ 手机：在棋盘上滑动</p>
  <p class="hint-rule">每次有效移动后会出现一个新数字（90% 是 2，10% 是 4）；相同数字相遇会合并。</p>

  <section class="history" aria-labelledby="history-title">
    <div class="history-heading">
      <h2 class="history-title" id="history-title">游戏记录</h2>
      <p class="history-note">完成一局后自动保存，最近保留 10 局</p>
    </div>
    <div class="history-stats">
      <div class="history-stat">
        <span class="history-stat-label">总游戏局数</span>
        <span class="history-stat-value" id="history-total">0</span>
      </div>
      <div class="history-stat">
        <span class="history-stat-label">历史最高分</span>
        <span class="history-stat-value" id="history-best">0</span>
      </div>
      <div class="history-stat">
        <span class="history-stat-label">历史最高数字</span>
        <span class="history-stat-value" id="history-max-tile">0</span>
      </div>
      <div class="history-stat">
        <span class="history-stat-label">胜利次数</span>
        <span class="history-stat-value" id="history-wins">0</span>
      </div>
    </div>
    <div class="history-panel">
      <div class="history-head" aria-hidden="true">
        <span>局数</span>
        <span class="history-score">最终得分</span>
        <span class="history-tile">最高数字</span>
        <span class="history-result">结果</span>
      </div>
      <div class="history-list" id="history-list" role="list"></div>
    </div>
  </section>

</div>

<script>
(function () {
  'use strict';

  /* ============ 1. 常量与 DOM 引用 ============ */
  var SIZE = 4;
  var TARGET = 2048;
  var SWIPE_THRESHOLD = 24;

  var boardEl = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlayEl = document.getElementById('overlay');
  var overlayTitleEl = document.getElementById('overlay-title');
  var overlayTextEl = document.getElementById('overlay-text');
  var btnContinue = document.getElementById('btn-continue');
  var btnRestartTop = document.getElementById('restart');
  var btnRestartOverlay = document.getElementById('btn-restart-overlay');
  var themeBtn = document.getElementById('theme-toggle');
  var aiStartBtn = document.getElementById('ai-start');
  var aiStopBtn = document.getElementById('ai-stop');
  var aiStatusEl = document.getElementById('ai-status');
  var aiSearchEl = document.getElementById('ai-search');
  var historyTotalEl = document.getElementById('history-total');
  var historyBestEl = document.getElementById('history-best');
  var historyMaxTileEl = document.getElementById('history-max-tile');
  var historyWinsEl = document.getElementById('history-wins');
  var historyListEl = document.getElementById('history-list');

  /* 经典 2048 方块配色：value -> {背景色, 文字色} */
  var TILE_COLORS = {
    0:    { bg: '#cdc1b4', fg: '#cdc1b4' },
    2:    { bg: '#eee4da', fg: '#776e65' },
    4:    { bg: '#ede0c8', fg: '#776e65' },
    8:    { bg: '#f2b179', fg: '#f9f6f2' },
    16:   { bg: '#f59563', fg: '#f9f6f2' },
    32:   { bg: '#f67c5f', fg: '#f9f6f2' },
    64:   { bg: '#f65e3b', fg: '#f9f6f2' },
    128:  { bg: '#edcf72', fg: '#f9f6f2' },
    256:  { bg: '#edcc61', fg: '#f9f6f2' },
    512:  { bg: '#edc850', fg: '#f9f6f2' },
    1024: { bg: '#edc53f', fg: '#f9f6f2' },
    2048: { bg: '#edc22e', fg: '#f9f6f2' }
  };
  function tileStyle(v) {
    return TILE_COLORS.hasOwnProperty(v) ? TILE_COLORS[v] : { bg: '#3c3a32', fg: '#f9f6f2' };
  }

  /* ============ 2. 游戏状态（唯一数据源，与 DOM 分离） ============ */
  var state = {
    grid: null,     // 4×4 二维数组，0 表示空格
    score: 0,
    status: 'playing' // 'playing' | 'won' | 'over'
  };
  var wonShown = false; // 2048 胜利提示只弹一次
  var recordedThisGame = false; // 防止同一局重复写入历史

  /* Best Score：localStorage 持久化，历史最高分 */
  var BEST_KEY = '2048.bestScore';
  function loadBestScore() {
    try {
      var n = parseInt(window.localStorage.getItem(BEST_KEY), 10);
      return isFinite(n) && n > 0 ? n : 0;
    } catch (e) { return 0; }
  }
  function saveBestScore(v) {
    try { window.localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 存储不可用时忽略 */ }
  }
  var bestScore = loadBestScore();

  /* ============ 主题切换（light/dark，localStorage 持久化） ============ */
  var THEME_KEY = '2048.theme';
  function loadTheme() {
    try {
      return window.localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light';
    } catch (e) { return 'light'; }
  }
  function saveTheme(t) {
    try { window.localStorage.setItem(THEME_KEY, t); } catch (e) { /* 存储不可用时忽略 */ }
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️ 浅色' : '🌙 深色';
  }
  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    saveTheme(next);
  }

  /* ============ 2.1 多局游戏记录（仅终局写入，localStorage 持久化） ============ */
  var HISTORY_KEY = '2048.gameHistory';
  var HISTORY_LIMIT = 10;

  function createEmptyHistory() {
    return {
      totalGames: 0,
      bestScore: 0,
      maxTile: 0,
      wins: 0,
      records: []
    };
  }

  function toNonNegativeInt(value) {
    var n = Number(value);
    if (!isFinite(n) || n < 0) return 0;
    return Math.floor(n);
  }

  function normalizeHistoryRecord(record) {
    if (!record || typeof record !== 'object') return null;
    if (record.result !== 'win' && record.result !== 'loss') return null;
    var id = toNonNegativeInt(record.id);
    if (id < 1) return null;
    return {
      id: id,
      score: toNonNegativeInt(record.score),
      maxTile: toNonNegativeInt(record.maxTile),
      result: record.result
    };
  }

  function normalizeGameHistory(data) {
    var clean = createEmptyHistory();
    if (!data || typeof data !== 'object') return clean;

    clean.totalGames = toNonNegativeInt(data.totalGames);
    clean.bestScore = toNonNegativeInt(data.bestScore);
    clean.maxTile = toNonNegativeInt(data.maxTile);
    clean.wins = toNonNegativeInt(data.wins);

    if (Array.isArray(data.records)) {
      for (var i = 0; i < data.records.length && clean.records.length < HISTORY_LIMIT; i++) {
        var record = normalizeHistoryRecord(data.records[i]);
        if (record) clean.records.push(record);
      }
    }

    var recentWins = 0;
    for (var j = 0; j < clean.records.length; j++) {
      clean.totalGames = Math.max(clean.totalGames, clean.records[j].id);
      clean.bestScore = Math.max(clean.bestScore, clean.records[j].score);
      clean.maxTile = Math.max(clean.maxTile, clean.records[j].maxTile);
      if (clean.records[j].result === 'win') recentWins++;
    }
    clean.totalGames = Math.max(clean.totalGames, clean.records.length);
    clean.wins = Math.max(clean.wins, recentWins);
    clean.wins = Math.min(clean.wins, clean.totalGames);
    return clean;
  }

  function loadGameHistory() {
    try {
      var raw = window.localStorage.getItem(HISTORY_KEY);
      return raw ? normalizeGameHistory(JSON.parse(raw)) : createEmptyHistory();
    } catch (e) {
      return createEmptyHistory(); // localStorage 不可用或数据损坏时静默回退
    }
  }

  function saveGameHistory() {
    try {
      window.localStorage.setItem(HISTORY_KEY, JSON.stringify(gameHistory));
    } catch (e) { /* 存储不可用时仍保留本次会话内记录 */ }
  }

  function getMaxTile() {
    var max = 0;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (state.grid[r][c] > max) max = state.grid[r][c];
      }
    }
    return max;
  }

  function renderHistory() {
    historyTotalEl.textContent = gameHistory.totalGames;
    historyBestEl.textContent = gameHistory.bestScore;
    historyMaxTileEl.textContent = gameHistory.maxTile;
    historyWinsEl.textContent = gameHistory.wins;
    historyListEl.innerHTML = '';

    if (gameHistory.records.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'history-empty';
      empty.textContent = '还没有游戏记录，完成一局后会显示在这里。';
      historyListEl.appendChild(empty);
      return;
    }

    for (var i = 0; i < gameHistory.records.length; i++) {
      var record = gameHistory.records[i];
      var row = document.createElement('div');
      row.className = 'history-row';
      row.setAttribute('role', 'listitem');

      var game = document.createElement('span');
      game.className = 'history-game';
      game.textContent = '第' + record.id + '局';

      var score = document.createElement('span');
      score.className = 'history-score';
      score.textContent = record.score + ' 分';

      var maxTile = document.createElement('span');
      maxTile.className = 'history-tile';
      maxTile.textContent = record.maxTile;

      var result = document.createElement('span');
      result.className = 'history-result ' +
        (record.result === 'win' ? 'result-win' : 'result-loss');
      result.textContent = record.result === 'win' ? '胜利' : '失败';

      row.appendChild(game);
      row.appendChild(score);
      row.appendChild(maxTile);
      row.appendChild(result);
      historyListEl.appendChild(row);
    }
  }

  function recordGameIfNeeded() {
    if (recordedThisGame) return false;
    if (state.status !== 'over' && state.status !== 'won') return false;

    var maxTile = getMaxTile();
    var result = (wonShown || maxTile >= TARGET) ? 'win' : 'loss';
    var id = gameHistory.totalGames + 1;

    gameHistory.totalGames = id;
    gameHistory.bestScore = Math.max(gameHistory.bestScore, state.score);
    gameHistory.maxTile = Math.max(gameHistory.maxTile, maxTile);
    if (result === 'win') gameHistory.wins++;

    gameHistory.records.unshift({
      id: id,
      score: state.score,
      maxTile: maxTile,
      result: result
    });
    if (gameHistory.records.length > HISTORY_LIMIT) {
      gameHistory.records.length = HISTORY_LIMIT;
    }

    recordedThisGame = true; // 先锁定，避免保存或渲染期间再次进入记录
    saveGameHistory();
    renderHistory();
    return true;
  }

  var gameHistory = loadGameHistory();

  function emptyGrid() {
    var g = [];
    for (var r = 0; r < SIZE; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) row.push(0);
      g.push(row);
    }
    return g;
  }

  /* ============ 3. 纯逻辑：单行滑动 + 合并 ============ */
  /**
   * 处理“朝索引 0 方向”的一行（长度为 4 的数组）。
   * 规则：先去零压缩 → 从左到右相邻相等合并一次（合并后跳过被合并格，禁止连锁）→ 末尾补零。
   * 返回 { line, gained, changed }。
   */
  function slideLine(line) {
    var tiles = [];
    for (var i = 0; i < line.length; i++) {
      if (line[i] !== 0) tiles.push(line[i]);
    }
    var out = [];
    var gained = 0;
    for (var j = 0; j < tiles.length; j++) {
      var cur = tiles[j];
      if (j + 1 < tiles.length && tiles[j + 1] === cur) {
        out.push(cur * 2);   // 合并到左侧
        gained += cur * 2;   // 分数 = 合并产生的值
        j++;                 // 跳过已合并的下一格（防止连锁合并）
      } else {
        out.push(cur);
      }
    }
    while (out.length < SIZE) out.push(0); // 末尾补零

    var changed = false;
    for (var k = 0; k < SIZE; k++) {
      if (out[k] !== line[k]) { changed = true; break; }
    }
    return { line: out, gained: gained, changed: changed };
  }

  /* ============ 4. 四个方向的抽取与写回 ============ */
  /* getLine：按方向取第 i 条“线”，统一整理成朝索引 0 滑动 */
  function getLine(dir, i, board) {
    var source = board || state.grid;
    var line = [];
    for (var k = 0; k < SIZE; k++) {
      if (dir === 'left')      line.push(source[i][k]);          // 行：左→右
      else if (dir === 'right') line.push(source[i][SIZE - 1 - k]); // 行反转：右→左
      else if (dir === 'up')   line.push(source[k][i]);          // 列：上→下
      else if (dir === 'down') line.push(source[SIZE - 1 - k][i]);  // 列反转：下→上
    }
    return line;
  }
  /* setLine：把滑动结果写回（与 getLine 的方向成镜像） */
  function setLine(dir, i, line, board) {
    var target = board || state.grid;
    for (var k = 0; k < SIZE; k++) {
      var val = line[k];
      if (dir === 'left')       target[i][k] = val;
      else if (dir === 'right') target[i][SIZE - 1 - k] = val;
      else if (dir === 'up')    target[k][i] = val;
      else if (dir === 'down')  target[SIZE - 1 - k][i] = val;
    }
  }

  /* ============ 5. 生成 / 胜利 / 结束判定 ============ */
  function spawnTile() {
    var empty = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (state.grid[r][c] === 0) empty.push([r, c]);
      }
    }
    if (empty.length === 0) return false;
    var pick = empty[Math.floor(Math.random() * empty.length)];
    state.grid[pick[0]][pick[1]] = Math.random() < 0.9 ? 2 : 4;
    return true;
  }

  function hasWon() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (state.grid[r][c] >= TARGET) return true;
      }
    }
    return false;
  }

  function isGameOver() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (state.grid[r][c] === 0) return false;          // 还有空格 → 未结束
        if (c + 1 < SIZE && state.grid[r][c] === state.grid[r][c + 1]) return false; // 行相邻可合并
        if (r + 1 < SIZE && state.grid[r][c] === state.grid[r + 1][c]) return false; // 列相邻可合并
      }
    }
    return true;
  }

  /* ============ 6. 移动 ============ */
  /**
   * 执行一次方向移动。只有“真的发生变化”才生成新数字、加分、更新状态。
   * 返回是否发生了有效移动。
   */
  function move(dir) {
    if (state.status !== 'playing') return false; // 结束/胜利弹窗期间不响应输入

    var moved = false;
    var gained = 0;
    for (var i = 0; i < SIZE; i++) {
      var res = slideLine(getLine(dir, i));
      if (res.changed) {
        moved = true;
        gained += res.gained;
        setLine(dir, i, res.line);
      }
    }

    if (!moved) return false; // 无效移动：不生成新数字

    state.score += gained;
    spawnTile();

    if (!wonShown && hasWon()) {
      wonShown = true;
      state.status = 'won';
    } else if (isGameOver()) {
      state.status = 'over';
      recordGameIfNeeded();
    }
    render();
    return true;
  }

  /* ============ 6.1 Expectimax AI 核心搜索（只读搜索，不控制真实游戏） ============ */
  var AI_DEPTH = 3;
  var AI_DIRECTIONS = ['up', 'down', 'left', 'right'];
  var AI_CORNER_ROW = SIZE - 1; // 固定右下角作为最大数字目标位置
  var AI_CORNER_COL = SIZE - 1;
  /* 从左上角沿蛇形路径到右下角的权重，与右下角策略保持一致 */
  var AI_SNAKE_WEIGHTS = [
    [0, 1, 2, 3],
    [7, 6, 5, 4],
    [8, 9, 10, 11],
    [15, 14, 13, 12]
  ];
  var aiNodes = 0;

  function cloneBoard(board) {
    var copy = [];
    for (var r = 0; r < SIZE; r++) copy.push(board[r].slice());
    return copy;
  }

  function log2Tile(value) {
    return value > 0 ? Math.log(value) / Math.LN2 : 0;
  }

  function isValidDirection(dir) {
    return AI_DIRECTIONS.indexOf(dir) !== -1;
  }

  /**
   * 在棋盘副本上模拟一次移动。纯函数，不生成随机方块，也不触碰真实 state。
   * 返回 { board, changed, gained }，其中 gained 为本次合并得分。
   */
  function simulateMove(board, dir) {
    var source = board || state.grid;
    var next = cloneBoard(source);
    if (!isValidDirection(dir)) {
      return { board: next, changed: false, gained: 0 };
    }

    var changed = false;
    var gained = 0;
    for (var i = 0; i < SIZE; i++) {
      var res = slideLine(getLine(dir, i, next));
      if (res.changed) {
        changed = true;
        gained += res.gained;
        setLine(dir, i, res.line, next);
      }
    }
    return { board: next, changed: changed, gained: gained };
  }

  function getEmptyCells(board) {
    var empty = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (board[r][c] === 0) empty.push([r, c]);
      }
    }
    return empty;
  }

  function isBoardGameOver(board) {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (board[r][c] === 0) return false;
        if (c + 1 < SIZE && board[r][c] === board[r][c + 1]) return false;
        if (r + 1 < SIZE && board[r][c] === board[r + 1][c]) return false;
      }
    }
    return true;
  }

  function getBoardMax(board) {
    var maxTile = 0;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (board[r][c] > maxTile) maxTile = board[r][c];
      }
    }
    return maxTile;
  }

  function lineMonotonicity(line) {
    var increasePenalty = 0;
    var decreasePenalty = 0;
    var previous = null;
    for (var i = 0; i < line.length; i++) {
      if (line[i] === 0) continue;
      var current = log2Tile(line[i]);
      if (previous !== null) {
        var diff = current - previous;
        if (diff > 0) increasePenalty -= diff;
        else if (diff < 0) decreasePenalty += diff;
      }
      previous = current;
    }
    return Math.max(increasePenalty, decreasePenalty);
  }

  /**
   * 棋盘启发式评分。分数越高越好，重点考虑空格和单调性，其次为固定右下角、
   * 蛇形分布、平滑度与合并潜力，直接合并收益只占较小权重。
   */
  function evaluateBoard(board) {
    var source = board || state.grid;
    var emptyCells = getEmptyCells(source);
    var monotonicity = 0;
    var smoothness = 0;
    var mergePotential = 0;
    var directMergeScore = 0;
    var cornerStrategy = 0;
    var snakeError = 0;
    var snakeTiles = 0;
    var maxTile = getBoardMax(source);
    var maxExponent = log2Tile(maxTile);
    var maxRow = -1;
    var maxCol = -1;

    for (var r = 0; r < SIZE; r++) {
      monotonicity += lineMonotonicity(source[r]);
      var col = [];
      for (var cr = 0; cr < SIZE; cr++) col.push(source[cr][r]);
      monotonicity += lineMonotonicity(col);

      for (var c = 0; c < SIZE; c++) {
        var value = source[r][c];
        if (value === 0) continue;
        var currentExponent = log2Tile(value);
        var distanceToCorner = Math.abs(r - AI_CORNER_ROW) + Math.abs(c - AI_CORNER_COL);
        var cornerRatio = 1 - distanceToCorner / (2 * (SIZE - 1));
        cornerStrategy += currentExponent * cornerRatio;

        var targetExponent = maxExponent * AI_SNAKE_WEIGHTS[r][c] / AI_SNAKE_WEIGHTS[AI_CORNER_ROW][AI_CORNER_COL];
        snakeError += Math.abs(currentExponent - targetExponent);
        snakeTiles++;

        if (value === maxTile) {
          if (maxRow === -1 || (r === AI_CORNER_ROW && c === AI_CORNER_COL)) {
            maxRow = r;
            maxCol = c;
          }
        }
        if (c + 1 < SIZE && source[r][c + 1] !== 0) {
          smoothness -= Math.abs(currentExponent - log2Tile(source[r][c + 1]));
          if (value === source[r][c + 1]) {
            mergePotential += currentExponent;
            directMergeScore += value;
          }
        }
        if (r + 1 < SIZE && source[r + 1][c] !== 0) {
          smoothness -= Math.abs(currentExponent - log2Tile(source[r + 1][c]));
          if (value === source[r + 1][c]) {
            mergePotential += currentExponent;
            directMergeScore += value;
          }
        }
      }
    }

    if (maxRow === -1) {
      maxRow = AI_CORNER_ROW;
      maxCol = AI_CORNER_COL;
    }
    var maxDistance = Math.abs(maxRow - AI_CORNER_ROW) + Math.abs(maxCol - AI_CORNER_COL);
    var maxCornerRatio = 1 - maxDistance / (2 * (SIZE - 1));
    var maxPositionScore = maxExponent * maxCornerRatio;
    var snakeScore = snakeTiles > 0 ? -snakeError : 0;

    return emptyCells.length * 250
      + monotonicity * 45
      + maxPositionScore * 80
      + cornerStrategy * 12
      + smoothness * 18
      + snakeScore * 30
      + mergePotential * 15
      + (Math.log(directMergeScore + 1) / Math.LN2) * 8;
  }

  /**
   * Expectimax 递归搜索。
   * max 节点：枚举四个方向的合法移动并取最大值。
   * chance 节点：平均枚举每个空格，再分别计算生成 2（0.9）和 4（0.1）的期望值。
   */
  function expectimax(board, depth, nodeType) {
    aiNodes++;
    var source = board || state.grid;
    var remaining = Math.max(0, Math.floor(Number(depth) || 0));
    var type = String(nodeType || 'max').toLowerCase();

    if (remaining === 0) return evaluateBoard(source);

    if (type === 'max') {
      var bestValue = -Infinity;
      var hasLegalMove = false;
      for (var i = 0; i < AI_DIRECTIONS.length; i++) {
        var sim = simulateMove(source, AI_DIRECTIONS[i]);
        if (!sim.changed) continue;
        hasLegalMove = true;
        var value = expectimax(sim.board, remaining - 1, 'chance');
        if (value > bestValue) bestValue = value;
      }
      return hasLegalMove ? bestValue : evaluateBoard(source);
    }

    if (type === 'chance') {
      var empty = getEmptyCells(source);
      if (empty.length === 0) return evaluateBoard(source);

      var total = 0;
      var cellProbability = 1 / empty.length;
      for (var e = 0; e < empty.length; e++) {
        var row = empty[e][0];
        var col = empty[e][1];

        var boardWith2 = cloneBoard(source);
        boardWith2[row][col] = 2;
        total += cellProbability * 0.9 * expectimax(boardWith2, remaining - 1, 'max');

        var boardWith4 = cloneBoard(source);
        boardWith4[row][col] = 4;
        total += cellProbability * 0.1 * expectimax(boardWith4, remaining - 1, 'max');
      }
      return total;
    }

    return evaluateBoard(source);
  }

  /**
   * 返回当前棋盘的最佳方向及搜索统计。搜索不会生成真实方块或修改真实 state。
   */
  function getBestMove(board) {
    var source = board || state.grid;
    var started = window.performance && window.performance.now
      ? window.performance.now()
      : Date.now();
    aiNodes = 0;
    aiNodes++; // 根 MAX 节点

    var bestMove = null;
    var bestValue = -Infinity;
    for (var i = 0; i < AI_DIRECTIONS.length; i++) {
      var dir = AI_DIRECTIONS[i];
      var sim = simulateMove(source, dir);
      if (!sim.changed) continue;
      var value = expectimax(sim.board, AI_DEPTH - 1, 'chance');
      if (bestMove === null || value > bestValue) {
        bestMove = dir;
        bestValue = value;
      }
    }

    if (bestMove === null) bestValue = evaluateBoard(source);

    var ended = window.performance && window.performance.now
      ? window.performance.now()
      : Date.now();
    return {
      move: bestMove,
      value: bestValue,
      depth: AI_DEPTH,
      nodes: aiNodes,
      elapsed: ended - started
    };
  }

  /* ============ 6.2 AI 自动驾驶控制器（只调用真实 move，不直接改写游戏状态） ============ */
  var AI_DELAY = 120;
  var AI_DIRECTION_TEXT = {
    up: '上',
    down: '下',
    left: '左',
    right: '右'
  };
  var aiController = {
    active: false,
    timerId: null,
    generation: 0,
    config: { delay: AI_DELAY },
    lastResult: null
  };

  function setAIStatus(stateKey, text) {
    aiStatusEl.setAttribute('data-state', stateKey);
    aiStatusEl.textContent = text;
  }

  function updateAIControls() {
    var canStart = state.status === 'playing' && !aiController.active;
    aiStartBtn.disabled = !canStart;
    aiStopBtn.disabled = !aiController.active;
  }

  function updateAISearchInfo(result) {
    aiController.lastResult = result || null;
    if (!result || !result.move) {
      aiSearchEl.textContent = 'AI 搜索：没有合法移动';
      return;
    }

    var direction = AI_DIRECTION_TEXT[result.move] || result.move;
    var elapsed = Number(result.elapsed) || 0;
    elapsed = elapsed < 10 ? Math.round(elapsed * 10) / 10 : Math.round(elapsed);
    aiSearchEl.textContent = 'AI 搜索：方向：' + direction +
      ' ｜ 深度：' + result.depth +
      ' ｜ 节点：' + result.nodes +
      ' ｜ 耗时：' + elapsed + ' ms';
  }

  /**
   * 停止 AI，并用 generation token 让已经排队的旧任务失效。
   * stateKey/text 用于区分用户停止与自动结束状态。
   */
  function stopAI(stateKey, text) {
    if (typeof stateKey !== 'string') {
      stateKey = null;
      text = '';
    }
    var wasActive = aiController.active || aiController.timerId !== null;
    aiController.active = false;
    if (aiController.timerId !== null) {
      clearTimeout(aiController.timerId);
      aiController.timerId = null;
    }
    aiController.generation++;

    if (stateKey) {
      setAIStatus(stateKey, text || '');
    } else if (wasActive) {
      setAIStatus('idle', 'AI 状态：已停止');
    }
    updateAIControls();
  }

  /**
   * 执行一步 AI：搜索 → 调用真实 move() → 根据真实状态决定是否继续。
   * 每一步只安排一个 setTimeout，避免固定 interval 与递归搜索并发。
   */
  function aiStep(generation) {
    if (!aiController.active || generation !== aiController.generation) return;
    if (state.status !== 'playing') {
      if (state.status === 'won') stopAI('won', 'AI 状态：已达到 2048');
      else if (state.status === 'over') stopAI('over', 'AI 状态：游戏结束');
      else stopAI();
      return;
    }

    var result = getBestMove(state.grid);
    if (!aiController.active || generation !== aiController.generation) return;
    updateAISearchInfo(result);

    if (!result || !result.move) {
      stopAI('no-move', 'AI 状态：没有合法移动');
      return;
    }

    var moved = move(result.move);
    if (!aiController.active || generation !== aiController.generation) return;

    if (!moved) {
      stopAI('idle', 'AI 状态：已停止');
      return;
    }
    if (state.status === 'won') {
      stopAI('won', 'AI 状态：已达到 2048');
      return;
    }
    if (state.status === 'over') {
      stopAI('over', 'AI 状态：游戏结束');
      return;
    }

    aiController.timerId = window.setTimeout(function () {
      aiController.timerId = null;
      aiStep(generation);
    }, aiController.config.delay);
  }

  function startAI() {
    if (aiController.active) return;
    if (state.status !== 'playing') {
      updateAIControls();
      return;
    }

    aiController.active = true;
    aiController.generation++;
    var generation = aiController.generation;
    aiController.lastResult = null;
    setAIStatus('running', 'AI 状态：运行中');
    updateAIControls();
    aiStep(generation);
  }

  /* ============ 7. 重开 / 继续 ============ */
  function newGame() {
    stopAI();
    if (state.status === 'over' || state.status === 'won') {
      recordGameIfNeeded(); // 重开时补记已结束的终局；进行中的对局不记录
    }
    state.grid = emptyGrid();
    state.score = 0;
    state.status = 'playing';
    wonShown = false;
    recordedThisGame = false;
    spawnTile();
    spawnTile();
    setAIStatus('idle', 'AI 状态：未运行');
    aiSearchEl.textContent = 'AI 搜索：等待启动';
    render();
  }

  function continueGame() {
    state.status = 'playing';
    if (isGameOver()) {
      state.status = 'over'; // 极少数：达成 2048 的同时已无可走
      recordGameIfNeeded();
    }
    render();
  }

  /* ============ 8. 渲染（只读 state，不反向读取 DOM） ============ */
  function render() {
    // 棋盘 16 格（行主序）
    boardEl.innerHTML = '';
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = state.grid[r][c];
        var cell = document.createElement('div');
        cell.className = 'cell';
        if (v !== 0) {
          cell.textContent = v;
          cell.setAttribute('data-value', v);
          if (v >= 1024) cell.className = 'cell cell-lg';
          var style = tileStyle(v);
          cell.style.background = style.bg;
          cell.style.color = style.fg;
        }
        /* 空格不设内联颜色：背景由 CSS 主题控制，方块色阶不变 */
        boardEl.appendChild(cell);
      }
    }

    if (state.score > bestScore) {
      bestScore = state.score;
      saveBestScore(bestScore);
    }
    bestEl.textContent = bestScore;
    scoreEl.textContent = state.score;
    updateAIControls();

    if (state.status === 'won') {
      overlayTitleEl.textContent = '你赢了！';
      overlayTextEl.textContent = '成功合成 ' + TARGET + '，太棒了！';
      btnContinue.hidden = false;
      overlayEl.hidden = false;
    } else if (state.status === 'over') {
      overlayTitleEl.textContent = '游戏结束';
      overlayTextEl.textContent = '没有可以移动或合并的方块了';
      btnContinue.hidden = true;
      overlayEl.hidden = false;
    } else {
      overlayEl.hidden = true;
    }
  }

  /* ============ 9. 事件绑定 ============ */
  // 键盘方向键
  var KEY_DIR = {
    ArrowUp: 'up',
    ArrowDown: 'down',
    ArrowLeft: 'left',
    ArrowRight: 'right'
  };
  window.addEventListener('keydown', function (e) {
    var dir = KEY_DIR[e.key];
    if (!dir) return;
    e.preventDefault(); // 阻止方向键滚动页面
    stopAI();
    move(dir);
  });

  // 触屏滑动
  var touchStart = null;
  boardEl.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  boardEl.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return; // 低于阈值不移动
    stopAI();
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  btnRestartTop.addEventListener('click', newGame);
  btnRestartOverlay.addEventListener('click', newGame);
  btnContinue.addEventListener('click', continueGame);
  themeBtn.addEventListener('click', toggleTheme);
  aiStartBtn.addEventListener('click', startAI);
  aiStopBtn.addEventListener('click', function () { stopAI(); });

  /* ============ 10. 调试接口 ============ */
  window.__game = {
    state: state,
    move: move,
    newGame: newGame,
    slideLine: slideLine,
    isGameOver: isGameOver,
    hasWon: hasWon,
    render: render,
    getBestScore: function () { return bestScore; },
    ai: {
      getBestMove: getBestMove,
      evaluateBoard: evaluateBoard,
      expectimax: expectimax,
      simulateMove: simulateMove,
      cloneBoard: cloneBoard,
      isBoardGameOver: isBoardGameOver,
      startAI: startAI,
      stopAI: stopAI,
      controller: aiController
    }
  };

  /* ============ 11. 启动 ============ */
  applyTheme(loadTheme()); // 恢复上次主题（默认 light，localStorage 不可用时静默回退）
  renderHistory();
  newGame();
})();
</script>
</body>
</html>
